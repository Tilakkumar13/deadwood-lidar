[project]
name = "deadwood-lidar"
version = "0.1.0"
description = "Standing dead tree classification from airborne LiDAR using NEON data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4",
  "laspy[lazrs]>=2.5", "requests>=2.31", "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deadwood"]
